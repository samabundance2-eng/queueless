<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>QUEUELESS Display</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#071E26;
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:25px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-icon{
  width:48px;
  height:48px;
  background:#18A999;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

.logo h1{
  font-size:25px;
  letter-spacing:2px;
}

.logo p{
  color:#7F999F;
  font-size:11px;
  margin-top:4px;
}

.live{
  display:flex;
  align-items:center;
  gap:8px;
  color:#65DFD0;
  background:rgba(24,169,153,.12);
  border:1px solid rgba(24,169,153,.2);
  padding:10px 15px;
  border-radius:30px;
  font-size:11px;
  font-weight:bold;
}

.live-dot{
  width:8px;
  height:8px;
  background:#18A999;
  border-radius:50%;
}

.main{
  flex:1;
  width:92%;
  max-width:1000px;
  margin:auto;
  padding:45px 0;
}

.now-label{
  text-align:center;
  color:#65DFD0;
  font-size:13px;
  letter-spacing:4px;
  font-weight:bold;
  margin-bottom:18px;
}

.current{
  background:#0C2A34;
  border:1px solid rgba(255,255,255,.07);
  border-radius:30px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.current-number{
  font-size:clamp(90px,18vw,180px);
  font-weight:900;
  letter-spacing:-8px;
  line-height:.9;
}

.current-service{
  margin-top:25px;
  color:#9BB3B8;
  font-size:18px;
}

.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:20px;
}

.panel{
  background:#0C2A34;
  border:1px solid rgba(255,255,255,.07);
  border-radius:22px;
  padding:25px;
  text-align:center;
}

.panel-title{
  color:#7F999F;
  font-size:11px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:14px;
}

.next-number{
  font-size:55px;
  font-weight:800;
  color:#65DFD0;
}

.waiting-count{
  font-size:55px;
  font-weight:800;
}

.panel-sub{
  color:#789198;
  font-size:12px;
  margin-top:7px;
}

.message{
  text-align:center;
  margin-top:30px;
  color:#718A91;
  font-size:12px;
}

.footer{
  text-align:center;
  padding:20px;
  color:#4F686F;
  font-size:10px;
}

.footer strong{
  color:#18A999;
}

@media(max-width:600px){

  header{
    padding:18px 5%;
  }

  .logo h1{
    font-size:19px;
  }

  .logo p{
    font-size:9px;
  }

  .logo-icon{
    width:40px;
    height:40px;
    font-size:19px;
  }

  .live{
    padding:8px 10px;
  }

  .main{
    padding:30px 0;
  }

  .current{
    padding:40px 15px;
  }

  .bottom{
    grid-template-columns:1fr;
  }

  .next-number,
  .waiting-count{
    font-size:45px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      Q
    </div>

    <div>

      <h1>QUEUELESS</h1>

      <p>
        Leave the queue. Keep your place.
      </p>

    </div>

  </div>

  <div class="live">

    <span class="live-dot"></span>

    LIVE QUEUE

  </div>

</header>


<main class="main">

  <div class="now-label">
    NOW SERVING
  </div>

  <div class="current">

    <div
      id="currentNumber"
      class="current-number"
    >
      —
    </div>

    <div
      id="currentService"
      class="current-service"
    >
      No patient currently being served
    </div>

  </div>


  <div class="bottom">

    <div class="panel">

      <div class="panel-title">
        NEXT UP
      </div>

      <div
        id="nextNumber"
        class="next-number"
      >
        —
      </div>

      <div
        id="nextText"
        class="panel-sub"
      >
        No one waiting
      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        IN QUEUE
      </div>

      <div
        id="waitingCount"
        class="waiting-count"
      >
        0
      </div>

      <div class="panel-sub">
        people waiting
      </div>

    </div>

  </div>


  <div class="message">
    Please listen for your queue number.
  </div>

</main>


<div class="footer">

  Powered by <strong>QUEUELESS</strong>

</div>


<script>

const SUPABASE_URL =
"https://zqnxzvclwkljhgnijduc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zeVLbVXNmCaoHDeco58fLQ_t7AbifbD";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function updateDisplay(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("queue_entries")
      .select("*")
      .order(
        "joined_at",
        {ascending:true}
      );

  if(error){

    console.error(error);

    return;

  }


  const current =
    data.find(
      item =>
        item.status === "called"
    );


  const waiting =
    data.filter(
      item =>
        item.status === "waiting"
    );


  document
    .getElementById("currentNumber")
    .textContent =
    current
      ? current.queue_number
      : "—";


  document
    .getElementById("currentService")
    .textContent =
    current
      ? current.service
      : "No patient currently being served";


  const next =
    waiting.length
      ? waiting[0]
      : null;


  document
    .getElementById("nextNumber")
    .textContent =
    next
      ? next.queue_number
      : "—";


  document
    .getElementById("nextText")
    .textContent =
    next
      ? next.service
      : "No one waiting";


  document
    .getElementById("waitingCount")
    .textContent =
    waiting.length;

}


updateDisplay();

setInterval(
  updateDisplay,
  3000
);

</script>

</body>
</html>

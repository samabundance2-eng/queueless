<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QUEUELESS — Queue Display</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #071E26;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      height: 78px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,30,38,0.95);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #18A999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
    }

    .logo-text h1 {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .logo-text p {
      font-size: 11px;
      color: #8EA8AF;
      margin-top: 3px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(24,169,153,0.12);
      border: 1px solid rgba(24,169,153,0.3);
      padding: 9px 14px;
      border-radius: 30px;
      color: #5DE0CF;
      font-size: 12px;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #18A999;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(24,169,153,0.6); }
      70% { box-shadow: 0 0 0 8px rgba(24,169,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(24,169,153,0); }
    }

    /* MAIN */
    .container {
      width: 92%;
      max-width: 1200px;
      margin: auto;
      padding: 45px 0;
    }

    .welcome {
      text-align: center;
      margin-bottom: 38px;
    }

    .welcome h2 {
      font-size: clamp(27px, 5vw, 48px);
      margin-bottom: 10px;
    }

    .welcome p {
      color: #91AAB1;
      font-size: 15px;
    }

    /* CURRENT SERVING */
    .serving-card {
      position: relative;
      background: linear-gradient(145deg, #0E3440, #092731);
      border: 1px solid rgba(24,169,153,0.25);
      border-radius: 28px;
      padding: 42px 25px;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    }

    .serving-card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #18A999;
      opacity: 0.06;
      top: -150px;
      right: -100px;
    }

    .serving-label {
      color: #6BE4D4;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .queue-number {
      font-size: clamp(80px, 18vw, 150px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -5px;
      margin: 8px 0 18px;
    }

    .service-name {
      color: #B7C9CE;
      font-size: 15px;
    }

    .serving-message {
      margin-top: 25px;
      display: inline-block;
      padding: 11px 18px;
      border-radius: 30px;
      background: rgba(24,169,153,0.12);
      color: #70E8D8;
      font-size: 13px;
    }

    /* NEXT + STATS */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .info-card {
      background: #0C2A34;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 22px;
      padding: 27px;
    }

    .info-title {
      color: #8FAAB1;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .next-number {
      font-size: 48px;
      font-weight: 800;
    }

    .next-service {
      color: #9DB3B8;
      margin-top: 5px;
      font-size: 13px;
    }

    .waiting-count {
      font-size: 48px;
      font-weight: 800;
      color: #18A999;
    }

    .waiting-text {
      color: #9DB3B8;
      font-size: 13px;
      margin-top: 5px;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #6D878E;
      font-size: 12px;
    }

    .footer strong {
      color: #18A999;
    }

    /* EMPTY STATE */
    .empty {
      padding: 80px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(24,169,153,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .empty h3 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .empty p {
      color: #829BA2;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 650px) {

      .topbar {
        height: 68px;
        padding: 0 20px;
      }

      .logo-text h1 {
        font-size: 17px;
      }

      .logo-icon {
        width: 37px;
        height: 37px;
        border-radius: 10px;
      }

      .live {
        padding: 7px 10px;
        font-size: 10px;
      }

      .container {
        width: 90%;
        padding: 32px 0;
      }

      .welcome {
        margin-bottom: 28px;
      }

      .serving-card {
        padding: 35px 18px;
        border-radius: 22px;
      }

      .bottom-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .info-card {
        padding: 20px 16px;
        border-radius: 18px;
      }

      .next-number,
      .waiting-count {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="logo">
      <div class="logo-icon">Q</div>

      <div class="logo-text">
        <h1>QUEUELESS</h1>
        <p>Leave the queue. Keep your place.</p>
      </div>
    </div>

    <div class="live">
      <span class="live-dot"></span>
      LIVE QUEUE
    </div>

  </header>


  <!-- MAIN -->
  <main class="container">

    <section class="welcome">
      <h2>Now Serving</h2>
      <p>Please watch the screen for your queue number.</p>
    </section>


    <!-- CURRENT -->
    <section class="serving-card">

      <div class="serving-label">
        CURRENTLY SERVING
      </div>

      <div class="queue-number" id="currentNumber">
        —
      </div>

      <div class="service-name" id="currentService">
        Waiting for the next customer
      </div>

      <div class="serving-message" id="servingMessage">
        Please wait for your turn
      </div>

    </section>


    <!-- NEXT + WAITING -->
    <section class="bottom-grid">

      <div class="info-card">

        <div class="info-title">
          Next Up
        </div>

        <div class="next-number" id="nextNumber">
          —
        </div>

        <div class="next-service" id="nextService">
          No one waiting
        </div>

      </div>


      <div class="info-card">

        <div class="info-title">
          In Queue
        </div>

        <div class="waiting-count" id="waitingCount">
          0
        </div>

        <div class="waiting-text">
          people waiting
        </div>

      </div>

    </section>


    <div class="footer">
      Powered by <strong>QUEUELESS</strong> • Smart Queue Management
    </div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://zqnxzvclwkljhgnijduc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zeVLbVXNmCaoHDeco58fLQ_t7AbifbD";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadDisplay() {

      try {

        const { data, error } =
          await supabaseClient
            .from("queue_entries")
            .select("*")
            .order("joined_at", { ascending: true });


        if (error) {
          console.error(error);
          return;
        }


        const waiting =
          data.filter(
            item => item.status === "waiting"
          );


        const called =
          data.filter(
            item => item.status === "called"
          );


        /* CURRENTLY SERVING */

        if (called.length > 0) {

          const current = called[called.length - 1];

          document.getElementById("currentNumber")
            .textContent =
            current.queue_number;

          document.getElementById("currentService")
            .textContent =
            current.service;

          document.getElementById("servingMessage")
            .textContent =
            "Please proceed to the service point";

        } else {

          document.getElementById("currentNumber")
            .textContent = "—";

          document.getElementById("currentService")
            .textContent =
            "Waiting for the next customer";

          document.getElementById("servingMessage")
            .textContent =
            "The next customer will be called shortly";

        }


        /* NEXT CUSTOMER */

        if (waiting.length > 0) {

          const next = waiting[0];

          document.getElementById("nextNumber")
            .textContent =
            next.queue_number;

          document.getElementById("nextService")
            .textContent =
            next.service;

        } else {

          document.getElementById("nextNumber")
            .textContent = "—";

          document.getElementById("nextService")
            .textContent =
            "No one waiting";

        }


        /* WAITING COUNT */

        document.getElementById("waitingCount")
          .textContent =
          waiting.length;


      } catch (err) {

        console.error(err);

      }

    }


    /* FIRST LOAD */

    loadDisplay();


    /* AUTO REFRESH */

    setInterval(
      loadDisplay,
      3000
    );

  </script>

</body>
</html>
